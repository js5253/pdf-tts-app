name: Build (Linux)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
env:
  DISCORD_ID: ${{vars.DISCORD_ID}}
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Git Repo
        uses: actions/checkout@v3
      - name: Output Git Release
        run: | 
          echo ${{ github.sha }} > Release.txt \
          && echo "RELEASE_VERSION=$(git rev-parse --short HEAD)" | tee -a $GITHUB_ENV

      - name: Install desktop (FLTK+tray_icon) dependency
        run: |
          sudo apt-get install -y \
          libx11-dev \
          libxext-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxrender-dev \
          libxfixes-dev \
          libxft-dev \
          libfontconfig1-dev \
          libpango1.0-dev \
          libglib2.0-dev \
          libcairo2-dev \
          libgdk-pixbuf2.0-dev \
          libgtk-3-dev \
          libxdo-dev
      - name: Install dbus dependency
        run: sudo apt install -y libdbus-1-dev
      - name: Build (Linux)
        run: cargo build --target=x86_64-unknown-linux-gnu -r --verbose
      - name: Run tests
        run: cargo test --verbose
      - name: Upload release
        uses: softprops/action-gh-release@v3
        with: 
          tag_name: ${{env.RELEASE_VERSION}}
          files: |
            Release.txt
            target/release/drp
